<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Central Animal · Pato Branco</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f766e, #134e4a); color: #fff;
    display: grid; place-items: center; padding: 24px; text-align: center;
  }
  main { max-width: 380px; }
  .pata { font-size: 56px; }
  h1 { font-size: 30px; margin: 12px 0 2px; }
  .sub { color: #ccfbf1; margin: 0; }
  .msg { margin-top: 28px; font-size: 18px; }
  .spin { width: 28px; height: 28px; margin: 28px auto 0; border: 3px solid rgb(255 255 255 / .25); border-top-color: #fff; border-radius: 50%; animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .fora { display: none; margin-top: 28px; background: rgb(255 255 255 / .1); border-radius: 16px; padding: 20px; }
  .fora p { margin: 0 0 10px; }
  .fora small { color: #ccfbf1; }
  body.offline .fora { display: block; }
  body.offline .spin, body.offline .msg { display: none; }
  a { color: #fff; }
</style>
</head>
<body>
<main>
  <div class="pata">🐾</div>
  <h1>Central Animal</h1>
  <p class="sub">Prefeitura de Pato Branco</p>
  <div class="spin"></div>
  <p class="msg">Conectando…</p>
  <div class="fora">
    <p><b>O protótipo está desligado no momento.</b></p>
    <p>A Central Animal fica disponível durante a apresentação no Ideathon GovTech Pato Branco 2026.</p>
    <small>Projeto do desafio GT-04 · Causa animal, comunidade e saúde coletiva</small>
  </div>
</main>
<script>
  // Endereço fixo que redireciona para o túnel do dia (definido em destino.json pelo `npm run tunnel:publicar`).
  // Também serve como 404.html: /central-animal/painel → <túnel>/painel
  (async function () {
    var base = '/central-animal';
    var resto = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : location.pathname;
    if (resto === '/' || resto === '/index.html' || resto === '/404.html') resto = '/';

    function offline() { document.body.className = 'offline'; }

    function comTempo(promessa, ms) {
      return Promise.race([promessa, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('tempo')); }, ms); })]);
    }

    try {
      var r = await comTempo(fetch(base + '/destino.json?t=' + Date.now(), { cache: 'no-store' }), 8000);
      var destino = (await r.json()).url;
      if (!destino) return offline();
      // Só a nossa API libera a leitura (CORS) de /api/health. Túnel morto responde 530 da Cloudflare
      // sem CORS → o fetch falha → mostramos "desligado" em vez de uma tela de erro.
      var saude = await comTempo(fetch(destino + '/api/health?t=' + Date.now(), { cache: 'no-store' }), 8000);
      if (!saude.ok) return offline();
      location.replace(destino + resto + location.search + location.hash);
    } catch (e) {
      offline();
    }
  })();
</script>
</body>
</html>
