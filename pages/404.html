<title>Central Animal · Pato Branco</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%230f766e'/><path fill='white' transform='translate(96 96) scale(.625)' d='M226.5 92.9c14.3 42.9-.3 86.2-32.6 96.8s-70.1-15.6-84.4-58.5s.3-86.2 32.6-96.8s70.1 15.6 84.4 58.5zM100.4 198.6c18.9 32.4 14.3 70.1-10.2 84.1s-59.7-.9-78.5-33.3S-2.7 179.3 21.8 165.3s59.7 .9 78.5 33.3zM69.2 401.2C121.6 259.9 214.7 224 256 224s134.4 35.9 186.8 177.2c3.6 9.7 5.2 20.1 5.2 30.5l0 1.6c0 25.8-20.9 46.7-46.7 46.7c-11.5 0-22.9-1.4-34-4.2l-88-22c-15.3-3.8-31.3-3.8-46.6 0l-88 22c-11.1 2.8-22.5 4.2-34 4.2C84.9 480 64 459.1 64 433.3l0-1.6c0-10.4 1.6-20.8 5.2-30.5zM421.8 282.7c-24.5-14-29.1-51.7-10.2-84.1s54-47.3 78.5-33.3s29.1 51.7 10.2 84.1s-54 47.3-78.5 33.3zM310.1 189.7c-32.3-10.6-46.9-53.9-32.6-96.8s52.1-69.1 84.4-58.5s46.9 53.9 32.6 96.8s-52.1 69.1-84.4 58.5z'/></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f766e, #134e4a); color: #fff;
    display: grid; place-items: center; padding: 24px; text-align: center;
  }
  main { max-width: 380px; }
  .pata { display: block; width: 56px; height: 56px; margin: 0 auto; color: #fff; }
  h1 { font-size: 30px; margin: 12px 0 2px; }
  .sub { color: #ccfbf1; margin: 0; }
  .msg { margin-top: 28px; font-size: 18px; }
  .spin { width: 28px; height: 28px; margin: 28px auto 0; border: 3px solid rgb(255 255 255 / .25); border-top-color: #fff; border-radius: 50%; animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .fora { display: none; margin-top: 28px; background: rgb(255 255 255 / .1); border-radius: 16px; padding: 20px; }
  .fora p { margin: 0 0 10px; }
  .fora small { color: #ccfbf1; }
  body.offline .fora { display: block; }
  body.offline .spin, body.offline .msg { display: none; }
  a { color: #fff; }
</style>
</head>
<body>
<main>
  <!-- Pata do deck: Font Awesome Free 6, CC BY 4.0 (fontawesome.com/license/free) -->
  <svg class="pata" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M226.5 92.9c14.3 42.9-.3 86.2-32.6 96.8s-70.1-15.6-84.4-58.5s.3-86.2 32.6-96.8s70.1 15.6 84.4 58.5zM100.4 198.6c18.9 32.4 14.3 70.1-10.2 84.1s-59.7-.9-78.5-33.3S-2.7 179.3 21.8 165.3s59.7 .9 78.5 33.3zM69.2 401.2C121.6 259.9 214.7 224 256 224s134.4 35.9 186.8 177.2c3.6 9.7 5.2 20.1 5.2 30.5l0 1.6c0 25.8-20.9 46.7-46.7 46.7c-11.5 0-22.9-1.4-34-4.2l-88-22c-15.3-3.8-31.3-3.8-46.6 0l-88 22c-11.1 2.8-22.5 4.2-34 4.2C84.9 480 64 459.1 64 433.3l0-1.6c0-10.4 1.6-20.8 5.2-30.5zM421.8 282.7c-24.5-14-29.1-51.7-10.2-84.1s54-47.3 78.5-33.3s29.1 51.7 10.2 84.1s-54 47.3-78.5 33.3zM310.1 189.7c-32.3-10.6-46.9-53.9-32.6-96.8s52.1-69.1 84.4-58.5s46.9 53.9 32.6 96.8s-52.1 69.1-84.4 58.5z"/></svg>
  <h1>Central Animal</h1>
  <p class="sub">Prefeitura de Pato Branco</p>
  <div class="spin"></div>
  <p class="msg">Conectando…</p>
  <div class="fora">
    <p><b>O protótipo está desligado no momento.</b></p>
    <p>A Central Animal fica disponível durante a apresentação no Ideathon GovTech Pato Branco 2026.</p>
    <small>Projeto do desafio GT-04 · Causa animal, comunidade e saúde coletiva</small>
  </div>
</main>
<script>
  // Endereço fixo que redireciona para o túnel do dia (definido em destino.json pelo `npm run tunnel:publicar`).
  // Também serve como 404.html: /central-animal/painel → <túnel>/painel
  (async function () {
    var base = '/central-animal';
    var resto = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : location.pathname;
    if (resto === '/' || resto === '/index.html' || resto === '/404.html') resto = '/';

    function offline() { document.body.className = 'offline'; }

    function comTempo(promessa, ms) {
      return Promise.race([promessa, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('tempo')); }, ms); })]);
    }

    try {
      var r = await comTempo(fetch(base + '/destino.json?t=' + Date.now(), { cache: 'no-store' }), 8000);
      var destino = (await r.json()).url;
      if (!destino) return offline();
      // Só a nossa API libera a leitura (CORS) de /api/health. Túnel morto responde 530 da Cloudflare
      // sem CORS → o fetch falha → mostramos "desligado" em vez de uma tela de erro.
      var saude = await comTempo(fetch(destino + '/api/health?t=' + Date.now(), { cache: 'no-store' }), 8000);
      if (!saude.ok) return offline();
      location.replace(destino + resto + location.search + location.hash);
    } catch (e) {
      offline();
    }
  })();
</script>
</body>
</html>
